[pytest]
# `backend` has no __init__.py, so without this pytest puts backend/ on
# sys.path (not the repo root) and every `import backend.x` fails unless
# you happen to run `python -m pytest`. Pinning pythonpath makes a bare
# `pytest` work from the repo root.
pythonpath = .
testpaths = backend/tests
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
